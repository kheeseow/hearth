name: Build Hearth NAS image

on:
  push:
    branches:
      - hearth-main
  workflow_dispatch:

concurrency:
  group: hearth-nas-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hearth
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the NAS image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:nas-latest
            ghcr.io/${{ github.repository }}:nas-${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
